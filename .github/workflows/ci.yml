name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pgcms
          POSTGRES_PASSWORD: pgcms_test
          POSTGRES_DB: pgcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgcms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pgcms:pgcms_test@localhost:5432/pgcms
      JWT_SECRET: ci_test_jwt_secret_min_32_chars_long
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: testsecret
      S3_BUCKET: test-bucket
      S3_PUBLIC_URL: http://localhost:9000/test-bucket

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run test -w packages/shared

      - run: npm run db:generate -w apps/api
      - run: npx prisma migrate deploy -w apps/api

      - run: npm run build
