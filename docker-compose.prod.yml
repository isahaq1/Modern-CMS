# Production stack — run from repo root:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Set REVALIDATE_SECRET, JWT_SECRET, and POSTGRES_PASSWORD in .env before deploying.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pgcms}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgcms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-pgcms_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-pgcms_minio_secret}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pgcms_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pgcms_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-pgcms-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      (mc mb local/$$S3_BUCKET || true) &&
      mc anonymous set download local/$$S3_BUCKET &&
      echo 'MinIO bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pgcms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgcms}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_NAME: ${COOKIE_NAME:-pgcms_token}
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pgcms_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pgcms_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-pgcms-media}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9010/pgcms-media}
      REVALIDATE_URL: http://web:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      FORMS_WEBHOOK_URL: ${FORMS_WEBHOOK_URL:-}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      COOKIE_NAME: ${COOKIE_NAME:-pgcms_token}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  minio-data:
